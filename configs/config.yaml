# If true (or data files are missing), a small demo dataset (word-reversal
# task) is generated under data/raw so the whole pipeline runs out of the box.
demo_data: true

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_src: data/raw/train.src
  train_tgt: data/raw/train.tgt
  val_src: data/raw/val.src
  val_tgt: data/raw/val.tgt

tokenizer:
  src_vocab: checkpoints/src_vocab.json
  tgt_vocab: checkpoints/tgt_vocab.json
  min_freq: 1
  lowercase: true

model:
  d_model: 128
  num_heads: 8
  num_encoder_layers: 3
  num_decoder_layers: 3
  d_ff: 512
  dropout: 0.1
  max_seq_len: 64

training:
  batch_size: 32
  num_epochs: 10
  learning_rate: 0.0005
  weight_decay: 0.0
  warmup_steps: 400
  scheduler: noam        # noam | cosine | none
  label_smoothing: 0.1
  clip_grad: 1.0
  device: auto           # auto | cuda | cpu
  checkpoint_dir: checkpoints
  checkpoint_name: best_model.pt
  log_interval: 20

inference:
  max_decode_len: 64